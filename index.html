
<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moda Mirror</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    
    @keyframes float {
      0% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(10px, -15px) rotate(5deg); }
      50% { transform: translate(20px, 0) rotate(0deg); }
      75% { transform: translate(10px, 15px) rotate(-5deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    .floating-character {
      position: fixed;
      font-size: 2em;
      pointer-events: none;
      z-index: -1;
      opacity: 0.6;
      animation: float 6s ease-in-out infinite;
      user-select: none;
    }body {
  margin: 0;
  background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
  color: #333;
  font-family: 'Outfit', sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 1em;
  text-align: center;
  overflow-y: auto;
}

.time {
  font-size: 3em;
  margin-bottom: 0.2em;
  color: #1a1a1a;
  font-weight: 600;
}

.date {
  font-size: 1.2em;
  margin-bottom: 2em;
  color: #777;
}

.section {
  margin: 1em 0;
  padding: 1.5em;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 15px;
  width: 90%;
  max-width: 400px;
  box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255, 255, 255, 0.18);
}

.label {
  font-size: 1.4em;
  color: #444;
  margin-bottom: 0.5em;
  font-weight: 600;
}

.value {
  font-size: 1em;
  color: #333;
}

input, select, button {
  padding: 0.7em;
  margin: 0.4em 0;
  font-size: 1em;
  border-radius: 8px;
  border: 1px solid #ccc;
  width: 90%;
  max-width: 300px;
  font-family: 'Outfit', sans-serif;
}

button {
  background: #4CAF50;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.3s;
}

button:hover {
  background: #45a049;
}

ul {
  list-style: none;
  padding: 0;
}

li {
  margin: 0.3em 0;
  color: #444;
}

.wardrobe-actions {
  display: flex;
  gap: 0.5em;
  justify-content: center;
  margin-top: 0.5em;
}

.edit-btn, .delete-btn {
  font-size: 0.8em;
  padding: 0.3em 0.6em;
  background: #e0e0e0;
  color: #333;
  border: 1px solid #bbb;
  border-radius: 5px;
  cursor: pointer;
}

.edit-btn:hover, .delete-btn:hover {
  background-color: #ccc;
}

  </style>
</head>
<body>
  <div class="time" id="time"></div>
  <div class="date" id="date"></div>  <div class="section">
    <div class="label">Today's Weather</div>
    <div class="value" id="weather">Sunny, 27°C</div>
  </div>  <div class="section">
    <div class="label">Outfit Suggestion</div>
    <div class="value" id="outfit">White shirt + denim jeans + sneakers</div>
  </div>  <div class="section">
    <div class="label">Quote of the Day</div>
    <div class="value" id="quote">"Style is a way to say who you are without speaking."</div>
  </div>  <div class="section">
    <div class="label">Add to Your Wardrobe</div>
    <form id="wardrobeForm">
      <input type="text" id="itemName" placeholder="Item name" required><br><br>
      <select id="itemType" required>
        <option value="">Select type</option>
        <option value="Top">Top</option>
        <option value="Bottom">Bottom</option>
        <option value="Shoes">Shoes</option>
        <option value="Accessory">Accessory</option>
      </select><br><br>
      <button type="submit">Add Item</button>
    </form>
  </div>  <div class="section">
    <div class="label">Your Wardrobe</div>
    <ul id="wardrobeList" class="value"></ul>
    <button onclick="generateOutfit()">Random Outfit</button>
    <div class="value" id="randomOutfit"></div>
  </div>  <script>
    function createFloatingCharacter() {
      const characters = ['🦋', '✨', '🌸', '🎀', '💫', '🌟'];
      const character = document.createElement('div');
      character.className = 'floating-character';
      character.textContent = characters[Math.floor(Math.random() * characters.length)];
      character.style.left = Math.random() * 100 + 'vw';
      character.style.top = Math.random() * 100 + 'vh';
      character.style.animationDelay = Math.random() * 5 + 's';
      document.body.appendChild(character);
      
      setTimeout(() => {
        character.remove();
      }, 15000);
    }

    // Create new characters periodically
    setInterval(createFloatingCharacter, 2000);
    // Create initial set of characters
    for(let i = 0; i < 10; i++) {
      createFloatingCharacter();
    }

    function updateTime() {
      const now = new Date();
      const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const date = now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });

      document.getElementById('time').textContent = time;
      document.getElementById('date').textContent = date;
    }

    setInterval(updateTime, 1000);
    updateTime();

    const form = document.getElementById('wardrobeForm');
    const wardrobeList = document.getElementById('wardrobeList');
    const randomOutfitDisplay = document.getElementById('randomOutfit');

    function loadWardrobe() {
      const items = JSON.parse(localStorage.getItem('wardrobe')) || [];
      wardrobeList.innerHTML = '';
      items.forEach((item, index) => {
        const li = document.createElement('li');
        li.innerHTML = `${item.name} (${item.type}) <div class="wardrobe-actions"><button class="edit-btn" onclick="editItem(${index})">Edit</button> <button class="delete-btn" onclick="deleteItem(${index})">Delete</button></div>`;
        wardrobeList.appendChild(li);
      });
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('itemName').value;
      const type = document.getElementById('itemType').value;

      const item = { name, type };
      const items = JSON.parse(localStorage.getItem('wardrobe')) || [];
      items.push(item);
      localStorage.setItem('wardrobe', JSON.stringify(items));

      form.reset();
      loadWardrobe();
    });

    function deleteItem(index) {
      const items = JSON.parse(localStorage.getItem('wardrobe')) || [];
      items.splice(index, 1);
      localStorage.setItem('wardrobe', JSON.stringify(items));
      loadWardrobe();
    }

    function editItem(index) {
      const items = JSON.parse(localStorage.getItem('wardrobe')) || [];
      const item = items[index];
      const newName = prompt("Edit item name:", item.name);
      const newType = prompt("Edit item type (Top/Bottom/Shoes/Accessory):", item.type);

      if (newName && newType) {
        items[index] = { name: newName, type: newType };
        localStorage.setItem('wardrobe', JSON.stringify(items));
        loadWardrobe();
      }
    }

    function generateOutfit() {
      const items = JSON.parse(localStorage.getItem('wardrobe')) || [];
      const types = ['Top', 'Bottom', 'Shoes'];
      const outfit = types.map(type => {
        const matches = items.filter(item => item.type === type);
        if (matches.length > 0) {
          return matches[Math.floor(Math.random() * matches.length)].name;
        } else {
          return `No ${type}`;
        }
      });
      randomOutfitDisplay.textContent = `Today's Look: ${outfit.join(' + ')}`;
    }

    loadWardrobe();
  </script></body>
</html>
